version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Swashbuckle 10 moves to Microsoft.OpenApi 2.x, which renames the types
      # used by the Swagger setup in the API; 9.x is kept until that migration.
      - dependency-name: Swashbuckle.AspNetCore
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per week for minor/patch bumps instead of one per package.
      nuget-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Base images of the Dockerfiles and of docker-compose.yml.
  - package-ecosystem: docker
    directories: ["/src/LogPulse.Api", "/src/LogPulse.Dashboard", "/src/LogPulse.Agent"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker
